name: Daily Election Pulse run

# Runs agent.py's full pipeline (fetch -> chart -> growth -> summary ->
# commit/push) once a day on GitHub's own servers, so it runs on
# schedule even if your laptop is off or asleep. Confirmed working via
# .github/workflows/test-bluesky-access.yml before this was added.
#
# Runs near the END of the UTC day (23:50), not the start -- growth.py
# compares "today" vs "yesterday" by calendar date, so a run early in
# the day only captures a few hours of "today" against a full 24 hours
# of "yesterday", making every day look artificially down. Running late
# captures nearly the whole day before it rolls over, so the next day's
# comparison is closer to a fair full-day-vs-full-day read. The 10-minute
# buffer before midnight allows for GitHub's own scheduling delay, which
# can run scheduled workflows a few minutes late during high load.
#
# The cron time below is in UTC (GitHub Actions doesn't support local
# timezones) -- adjust the hour/minute to shift when it runs.
on:
  schedule:
    - cron: "50 23 * * *" # 23:50 UTC daily
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/election-pulse-setup-f5lyfh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for the automated commit
        run: |
          git config user.name "Election Pulse Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run agent.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional -- agent.py skips the AI summary step gracefully if
          # this secret isn't set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py
