name: Daily Election Pulse run

# Runs agent.py's full pipeline (fetch -> chart -> growth -> summary ->
# commit/push) once a day on GitHub's own servers, so it runs on
# schedule even if your laptop is off or asleep. Confirmed working via
# .github/workflows/test-bluesky-access.yml before this was added.
#
# Runs near the END of the day, not the start -- growth.py compares
# "today" vs "yesterday" by calendar date, so a run early in the day
# only captures a few hours of "today" against a full 24 hours of
# "yesterday", making every day look artificially down. Running late
# captures nearly the whole day before it rolls over, so the next day's
# comparison is closer to a fair full-day-vs-full-day read.
#
# GitHub Actions cron is fixed UTC and has NO concept of timezones or
# daylight saving -- it will NOT auto-adjust for BST/GMT. 22:37 UTC
# below is chosen to land at 23:37 *British Summer Time* (UTC+1),
# correct while the UK is on BST (late March - late October). Once the
# UK clocks go back to GMT (UTC+0) for winter, 22:37 UTC will drift to
# meaning 22:37 GMT -- an hour earlier than intended -- until this is
# manually flipped to "37 23 * * *" (23:37 UTC = 23:37 GMT). Flip it
# back to 22:37 UTC the following spring when BST resumes.
#
# The minute is deliberately NOT a round number (not :00/:15/:30/:45/:50).
# GitHub's own docs warn that scheduled workflows can be delayed during
# periods of high load, and popular round minutes are where that load
# concentrates -- every repo whose owner picked a "clean" time collides
# on the same slot. We hit this in practice: with "50 22 * * *" the
# workflow fired ~9 hours late two nights running (~07:40 UTC instead of
# 22:50 UTC) -- consistent enough to be scheduler congestion rather than
# random jitter. If runs still land far from 22:37 UTC after this
# change, GitHub's scheduler may simply be deprioritizing this repo's
# scheduled runs (a known behavior on public/free-tier repos with low
# Actions usage) rather than anything fixable by picking a better minute.
on:
  schedule:
    - cron: "37 22 * * *" # 22:37 UTC daily = 23:37 BST (UTC+1)
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/election-pulse-setup-f5lyfh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for the automated commit
        run: |
          git config user.name "Election Pulse Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run agent.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional -- agent.py skips the AI summary step gracefully if
          # this secret isn't set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py
