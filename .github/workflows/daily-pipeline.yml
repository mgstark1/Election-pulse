name: Daily Election Pulse run

# Runs agent.py's full pipeline (fetch -> chart -> growth -> summary ->
# commit/push) once a day, so it runs on schedule even if your laptop is
# off or asleep. Confirmed working via
# .github/workflows/test-bluesky-access.yml before this was added.
#
# NOT triggered by GitHub's own `on: schedule` cron -- we tried that
# (see git history) and it proved unreliable for this repo: scheduled
# runs landed anywhere from ~9 to ~12 hours late, night after night,
# even after moving off a "popular" round minute. GitHub's docs
# acknowledge scheduled workflows can be delayed under load and don't
# guarantee an exact fire time, and in practice this seems to be
# GitHub deprioritizing scheduled runs on this repo (public, free
# tier, light Actions usage) rather than anything fixable from our
# side.
#
# Instead, this workflow is triggered daily via workflow_dispatch by an
# external scheduler (a Claude Code Remote Routine, outside this repo)
# calling the GitHub API directly at 22:37 UTC (23:37 British Summer
# Time) -- a direct API call isn't subject to GitHub's own scheduling
# queue, so it fires on time. It runs near the END of the day, not the
# start, on purpose: growth.py compares "today" vs "yesterday" by
# calendar date, so a run early in the day only captures a few hours of
# "today" against a full 24 hours of "yesterday," making every day look
# artificially down. Running late captures nearly the whole day first.
#
# GitHub Actions (and this external scheduler) use fixed UTC with NO
# concept of timezones or daylight saving. 22:37 UTC is chosen to land
# at 23:37 BST, correct while the UK is on BST (late March - late
# October). Once the UK clocks go back to GMT for winter, the external
# Routine's schedule needs to be manually flipped to 23:37 UTC to keep
# meaning 23:37 GMT -- update the Routine itself (not this file; there's
# no cron here anymore). Flip it back to 22:37 UTC the following spring.
#
# workflow_dispatch below also lets you trigger a run manually from the
# Actions tab, same as always.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/election-pulse-setup-f5lyfh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for the automated commit
        run: |
          git config user.name "Election Pulse Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run agent.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional -- agent.py skips the AI summary step gracefully if
          # this secret isn't set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py
